plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

// The sources live flat in the project root, so point Gradle there instead of
// moving them into src/main/java. 'include' keeps the test folder out of main.
sourceSets {
    main {
        java {
            srcDirs = ['.']
            include '*.java'
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}
